name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 shellcheck nodejs appstream \
            desktop-file-utils dpkg-dev
      - name: Lint
        run: |
          for f in *.py; do python3 -m py_compile "$f"; done
          shellcheck -S warning install.sh uninstall.sh \
            packaging/debian/build-deb.sh packaging/fedora/build-rpm.sh
          cp gnome-extension/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
          appstreamcli validate --no-net io.github.gnhen.midscroll.Settings.metainfo.xml
          desktop-file-validate io.github.gnhen.midscroll.Settings.desktop
      - name: Build and install the .deb
        run: |
          ./packaging/debian/build-deb.sh
          apt-get install -y ./dist/midscroll_*_all.deb
          midscroll --version
